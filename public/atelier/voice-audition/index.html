<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Audition · A Listening Session</title>
  <meta name="description" content="A guided listening deck for auditioning candidate voices for an AI voicebot — paired and ranked samples, judged by ear." />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Spectral latent-space backdrop -->
  <div class="void" aria-hidden="true">
    <div class="mesh">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
      <span class="blob b4"></span>
    </div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- Deck: slides injected by app.js -->
  <main id="deck" class="deck" aria-live="polite"></main>

  <!-- Persistent transport / navigation -->
  <footer class="hud" aria-label="Deck navigation">
    <button class="hud-btn" id="prev" type="button" aria-label="Previous slide">
      <span class="hud-arrow">←</span><span class="hud-btn-label">Prev</span>
    </button>

    <div class="hud-center">
      <div class="counter">
        <span id="counter-now">00</span><span class="counter-sep">/</span><span id="counter-total">09</span>
      </div>
      <div class="rail" id="rail" role="presentation">
        <div class="rail-fill" id="rail-fill"></div>
      </div>
      <div class="kbd-hint" aria-hidden="true">
        <kbd>←</kbd><kbd>→</kbd> move &nbsp;·&nbsp; <kbd>Space</kbd> play/pause
      </div>
    </div>

    <button class="hud-btn" id="next" type="button" aria-label="Next slide">
      <span class="hud-btn-label">Next</span><span class="hud-arrow">→</span>
    </button>
  </footer>

  <noscript>
    <div class="noscript">This listening deck needs JavaScript to play the voice samples.</div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
